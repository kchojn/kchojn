comments:
  # Shown when the same player moves twice in a row. {author} is the issue author.
  consecutive_moves: "{author}, you just moved. Let someone else take the next turn."

  # Shown when the game ends. {outcome} says who won or that it is a draw, {num_moves} is the
  # number of moves, {num_players} the number of players and {players} a comma-separated list of them.
  game_over: |-
      Game over. {outcome}. {num_moves} moves by {num_players} players: {players}.

      Thanks for playing. Anyone can start the next game from the README.

  # Shown when the board is in an invalid state. Should never happen.
  invalid_board: "{author}, I cannot play that: the board is in an invalid state."

  # Shown when a player submits a move that is not legal on the current board.
  invalid_move: |-
      {author}, the move `{move}` is not legal here. Someone probably moved before you.
      Open the README again and pick from the current list.

  # Shown when someone other than the repository owner tries to restart a game in progress.
  invalid_new_game: "{author}, a game is in progress. Only the repository owner can restart it."

  # Shown after a legal move. {move} is the move in UCI notation, e2e4 for example.
  successful_move: "{author}, played `{move}`. The board in the README is updated."

  # Shown when a new game starts.
  successful_new_game: "{author}, a new game has started. White moves first."

  # Shown when the issue title is not a command the bot knows.
  unknown_command: "{author}, I did not understand that title. Use a link from the README and leave the title as it is."

issues:
  link: "https://github.com/{repo}/issues/new?{params}"
  move:
    body: "Press Submit new issue and leave the title as it is. The bot plays the move and closes this issue."
    title: "Chess: Move {source} to {dest}"
  new_game:
    body: "Press Submit new issue and leave the title as it is."
    title: "Chess: Start new game"

markers:
  board:
    begin: "<!-- BEGIN CHESS BOARD -->\n"
    end: "<!-- END CHESS BOARD -->\n"
  last_moves:
    begin: "<!-- BEGIN LAST MOVES -->\n"
    end: "<!-- END LAST MOVES -->\n"
  moves:
    begin: "<!-- BEGIN MOVES LIST -->\n"
    end: "<!-- END MOVES LIST -->\n"
  top_moves:
    begin: "<!-- BEGIN TOP MOVES -->\n"
    end: "<!-- END TOP MOVES -->\n"
  turn:
    begin: "<!-- BEGIN TURN -->"
    end: "<!-- END TURN -->"

misc:
  # Number of recent moves listed under the board
  max_last_moves: 5
  # Number of players in the all-time table
  max_top_moves: 10
