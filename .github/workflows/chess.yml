# Plays one chess move per issue whose title starts with "Chess:", then rewrites the
# board in README.md and commits it. Runs from the default branch only, as every
# issue-triggered workflow does. Moves are serialized so two issues opened at the
# same time cannot race on the push.
name: chess

on:
  issues:
    types: [opened]

concurrency:
  group: chess
  cancel-in-progress: false

jobs:
  move:
    permissions:
      issues: write
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.event.issue.title, 'Chess:')

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Play the move
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          pip install -r requirements.txt
          python main.py

      - name: Commit the new board
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "${ISSUE_TITLE} by ${ISSUE_AUTHOR}"
          git push
